<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1 id="store-name">Loja</h1>
    <input id="search" placeholder="🔍 Buscar produto..." />
  </header>

  <main>
    <div id="products" class="grid"></div>
  </main>

  <button id="cart-toggle">🛒 Carrinho (<span id="cart-count">0</span>)</button>

  <div id="cart-panel" class="hidden">
    <h2>Seu pedido</h2>
    <div id="cart-items"></div>
    <p class="total">Total: <span id="cart-total">R$ 0,00</span></p>
    <input id="customer-name" placeholder="Seu nome *" />
    <input id="customer-note" placeholder="Observação (opcional)" />
    <button id="send-order">✅ Confirmar e enviar pedido</button>
    <button id="close-cart">Fechar</button>
  </div>

  <script type="module" src="js/catalog.js"></script>
</body>
</html>
