<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conveniência Duzinho</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">CONVENIÊNCIA <span>DUZINHO</span></div>
    <input id="search" placeholder="🔍 Buscar produto..." />
  </header>

  <section class="hero">
    <div class="hero-overlay">
      <h1>BEM-VINDO À <span>DUZINHO</span></h1>
      <p>Bebidas geladas, salgadinhos, doces e eletrônicos — peça direto pelo site!</p>
      <a href="#produtos" class="cta">VER PRODUTOS ↓</a>
    </div>
  </section>

  <main id="produtos">
    <div id="sections"></div>
  </main>

  <button id="cart-toggle">🛒 Carrinho (<span id="cart-count">0</span>)</button>

  <div id="cart-panel" class="hidden">
    <h2>Seu pedido</h2>
    <div id="cart-items"></div>
    <p class="total">Total: <span id="cart-total">R$ 0,00</span></p>
    <input id="customer-name" placeholder="Seu nome *" />
    <input id="customer-note" placeholder="Observação (opcional)" />
    <button id="send-order">✅ Confirmar e enviar pedido</button>
    <button id="close-cart">Fechar</button>
  </div>

  <a href="admin.html" id="admin-link" title="Área do dono">⚙️</a>

  <script type="module" src="js/catalog.js"></script>
</body>
</html>
